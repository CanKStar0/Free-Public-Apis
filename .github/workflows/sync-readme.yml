name: Sync API directory README

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [catalog_updated]

permissions:
  contents: write

concurrency:
  group: sync-api-directory-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: CanKStar0/Free-API
          ref: main
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Sync generated API links
        env:
          UPSTREAM_API_INDEX: upstream-source/github-api-directory/README.md
        run: node scripts/sync-readme.mjs
      - name: Commit README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync API directory"
          git push
